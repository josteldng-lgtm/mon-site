<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Heart Landing</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #000;
  }
  #caption {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 48px;
    color: #fff;
    text-shadow: 0 0 15px rgba(255,255,255,0.6);
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
</style>
</head>
<body>
<canvas id="heart"></canvas>
<div id="caption">Love you.</div>

<script>
const canvas = document.getElementById('heart');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return { x, y };
}

const word = "i love you ";
const particles = [];
const numPoints = 700;

for (let i = 0; i < numPoints; i++) {
  const t = Math.PI * 2 * (i / numPoints);
  let { x, y } = heartPoint(t);

  const jitterAmount = 1.4;
  x += (Math.random() - 0.5) * jitterAmount * 2;
  y += (Math.random() - 0.5) * jitterAmount * 2;

  if (Math.random() < 0.4) {
    x *= 0.85 + Math.random() * 0.1;
    y *= 0.85 + Math.random() * 0.1;
  }

  particles.push({
    x, y,
    delay: Math.random() * 1.2,
    text: "Dona",
    size: 11 + Math.random() * 6,
    hueShift: Math.random()
  });
}

const scale = () => Math.min(W, H) / 34;
const centerX = () => W / 2;
const centerY = () => H / 2 + Math.min(W, H) * 0.03;

let startTimestamp = null;

function draw(timestamp) {
  if (!startTimestamp) startTimestamp = timestamp;
  const elapsed = (timestamp - startTimestamp) / 1000;

  ctx.clearRect(0, 0, W, H);

  const grad = ctx.createRadialGradient(centerX(), centerY(), 10, centerX(), centerY(), Math.min(W,H)*0.6);
  grad.addColorStop(0, 'rgba(40,0,0,0.4)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const s = scale();
  const cx = centerX();
  const cy = centerY();

  particles.forEach(p => {
    const localTime = elapsed - p.delay;
    if (localTime < 0) return;

    const targetX = cx + p.x * s;
    const targetY = cy - p.y * s;

    let drawX, drawY, alpha;

    const fallDuration = 0.9;
    if (localTime < fallDuration) {
      const progress = localTime / fallDuration;
      const eased = 1 - Math.pow(1 - progress, 3);
      drawX = targetX;
      drawY = targetY - (1 - eased) * 220;
      alpha = eased;
    } else {
      drawX = targetX;
      drawY = targetY;
      alpha = 0.75 + 0.25 * Math.sin(elapsed * 3 + p.hueShift * 10);
    }

    ctx.font = `${p.size}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const glowColor = `rgba(255,${60 + p.hueShift*80},${20 + p.hueShift*40},${alpha})`;
    ctx.shadowColor = 'rgba(255,40,20,0.9)';
    ctx.shadowBlur = 8 + p.hueShift * 6;
    ctx.fillStyle = glowColor;
    ctx.fillText(p.text, drawX, drawY);
  });

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

setTimeout(() => {
  document.getElementById('caption').style.opacity = '1';
}, 1800);
</script>
</body>
</html>
